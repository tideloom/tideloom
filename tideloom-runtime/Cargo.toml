[package]
name = "tideloom-runtime"
version = "0.1.0"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tideloom-core = { path = "../tideloom-core" }
tokio = { version = "1", features = ["sync"] }
ureq = { version = "3.4.2", default-features = false }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tideloom-runtime = { path = ".", features = ["test-util"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[features]
# Test helpers that advance a `ManualClock` from the store's next due instant.
# Production builds do not include them. Integration tests opt in through
# dev-dependencies. The acceptance example opts in below.
test-util = []

[[example]]
name = "single_process"
required-features = ["test-util"]

[lints]
workspace = true
